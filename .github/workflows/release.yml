name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # body_path used to be CHANGELOG.md itself, which published the entire
      # file — every version back to 1.0 — as the notes for one release.
      # Print from the first "## " heading up to the second: the newest section.
      - name: Extract release notes
        run: awk '/^## /{n++} n==1' CHANGELOG.md > RELEASE_NOTES.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: false