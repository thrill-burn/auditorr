name: Build and Push Docker Image

on:
  push:
    branches: [ main, experimental ]
    tags: [ 'v*' ]

jobs:
  # The backend suite, on the Python the container runs (Dockerfile: python:3.12-slim).
  # The image build below `needs` it, so a red suite publishes no image for main,
  # experimental or a tag: "If a job fails or is skipped, all jobs that need it are
  # skipped unless the jobs use a conditional expression that causes the job to
  # continue" (GitHub Docs, workflow syntax, jobs.<job_id>.needs). Phase 14,
  # decision 1 (a). The frontend needs no step here: the image build fails on a
  # broken bundle already.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # The script tests run the generated bash scripts; bash, GNU stat, cmp and
      # ln are on the runner already.
      - name: Backend tests
        run: python -m pytest backend_tests -q -p no:cacheprovider

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # arm64 emulation for the runtime stage (pure-Python deps, so no
      # compilation happens under QEMU — see the frontend note in Dockerfile).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/thrill-burn/auditorr
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}