services:
  auditorr:
    build: .                      # builds from source — remove this line if using a pre-built image
    # image: auditorr:latest      # uncomment to use a pre-built image instead
    container_name: auditorr
    restart: unless-stopped
    ports:
      - "8677:8677"
    volumes:
      - ./data:/app/data          # config, history, SQLite db
      - /path/to/media:/data/media:ro
      - /path/to/torrents:/data/torrents:ro
    environment:
      # Configure qBittorrent, Sonarr, Radarr, and thresholds via the Config tab in the UI.
      # No environment variables needed for integration settings.
      - AUDITORR_PORT=8677
      # Without a secret, only local clients (loopback + private ranges) are
      # served — non-local requests get 401. Set a long random value to allow
      # remote access and require the key from everyone (the UI prompts for it):
      # - AUDITORR_SECRET=your-secret-key-here
      # Extra CIDRs treated as local, e.g. Tailscale:
      # - AUDITORR_TRUSTED_NETWORKS=100.64.0.0/10
      # Strict mode: require the key even from local clients:
      # - AUDITORR_REQUIRE_AUTH=true
